<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ninours</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ninours">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0}
#pseudoBox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,4,16,0.78);z-index:5;font-family:'Trebuchet MS','Avenir Next',system-ui,sans-serif}
#pseudoBox[hidden]{display:none}
#pseudoBox form{background:linear-gradient(#1b1640,#0d0b24);border:1px solid rgba(160,140,255,0.5);border-radius:18px;padding:18px 20px;box-shadow:0 0 40px rgba(120,100,255,0.35);display:flex;flex-direction:column;gap:12px;width:min(320px,80vw)}
#pseudoBox h2{margin:0;color:#ffe2b0;font-size:20px;text-align:center}
#pseudoBox input{font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid rgba(160,230,255,0.5);background:rgba(255,255,255,0.08);color:#fff;outline:none;user-select:text;-webkit-user-select:text}
#pseudoBox button{font:inherit;font-weight:800;font-size:17px;padding:10px;border:0;border-radius:10px;background:#5fd8ff;color:#08142a}
#safe{position:absolute;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<div id="safe"></div>
<div id="pseudoBox" hidden><form id="pseudoForm" autocomplete="off"><h2>Ton pseudo</h2><input id="pseudoIn" maxlength="14" placeholder="Ex : Amélie" enterkeyhint="go"><button type="submit">C'est parti !</button></form></div>
<canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),safeEl=document.getElementById('safe');
const FONT="'Trebuchet MS','Avenir Next',system-ui,sans-serif";
let W,H,S,surfY,floorY,bearHome,bearX,safeT=0,safeL=0,safeR=0,safeB=0,portrait=false;

const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const lerp=(a,b,k)=>a+(b-a)*k;

function sprite(r,g,b){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const gr=x.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(0.25,`rgba(${r},${g},${b},0.55)`);gr.addColorStop(0.6,`rgba(${r},${g},${b},0.14)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,64,64);return c;}
const G={cyan:sprite(80,235,255),mag:sprite(255,80,200),orange:sprite(255,160,60),gold:sprite(255,215,120),blue:sprite(40,130,255),green:sprite(110,255,170),white:sprite(210,235,255),red:sprite(255,70,80)};
G.violet=sprite(150,90,255);G.indigo=sprite(90,80,255);
const APAL=[{s:G.blue,c:'#5a8cff'},{s:G.violet,c:'#a77bff'},{s:G.cyan,c:'#7fe8ff'},{s:G.mag,c:'#d06bff'},{s:G.indigo,c:'#7d74ff'}];
const PAL=[{s:G.cyan,c:'#6ff0ff'},{s:G.mag,c:'#ff6fd0'},{s:G.orange,c:'#ffae55'},{s:G.green,c:'#8dffb8'},{s:G.gold,c:'#ffe08a'}];
let A=0,abyssSaid=false; // 0 = lagoon, 1 = abyss (fades in around 1000 m)
function palAt(seed){return hash(seed+77)<A?APAL[Math.floor(hash(seed+5)*APAL.length)]:PAL[Math.floor(hash(seed+13)*PAL.length)];}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255];}
function mix(a,b,k,al){const x=hexRgb(a),y=hexRgb(b);const c=x.map((v,i)=>Math.round(v+(y[i]-v)*k));return al==null?`rgb(${c})`:`rgba(${c},${al})`;}
const Q=[];
function q(s,x,y,r,a){Q.push([s,x,y,r,a]);}
function flush(){ctx.save();ctx.globalCompositeOperation='lighter';for(const g of Q){ctx.globalAlpha=clamp(g[4],0,1);ctx.drawImage(g[0],g[1]-g[3],g[2]-g[3],g[3]*2,g[3]*2);}ctx.restore();Q.length=0;}

let stars=[],plankton=[];
function initAmbient(){
  stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*surfY*0.85,r:Math.random()*1.3+0.3,p:Math.random()*6});
  plankton=[];for(let i=0;i<60;i++)plankton.push({x:Math.random()*W,y:rand(surfY+10,floorY),z:rand(0.3,1.2),p:Math.random()*6,s:[G.cyan,G.green,G.mag,G.cyan][i%4],sa:[G.violet,G.blue,G.mag,G.indigo][i%4],h:Math.random()});
}
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;portrait=H>W*1.05;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=clamp(Math.min(H/500,W/800),0.6,1.5);
  surfY=Math.round(H*0.22);floorY=Math.round(H*0.93);
  const cs=getComputedStyle(safeEl);
  safeT=parseFloat(cs.paddingTop)||0;safeR=parseFloat(cs.paddingRight)||0;safeB=parseFloat(cs.paddingBottom)||0;safeL=parseFloat(cs.paddingLeft)||0;
  bearHome=Math.max(safeL+170*S,W*0.3);if(bearX==null)bearX=bearHome;
  initAmbient();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();

// ---------- state ----------
let state='menu',t=0,scroll=0,speed=0,dist=0,o2=100,prevUnder=true;
const bear={y:surfY+70*S,vy:0,ang:0,phase:0};
let enemies=[],items=[],airs=[],puffs=[],fx=[],reefs=[],coins=[];
let touchPrev=false,maxScroll=0,invulnT=0,shakeT=0,coinsRun=0,nextCoin=0,totalCoins=0;
let scooterT=0,nextEnemy=0,nextThrow=0,nextAir=0,overT=0,deathReason='',newRecord=false,sayCool=0,puffT=0,nextMile=250,nextReef=0,reefCount=0;
const koala={say:'',sayT:0,throwAnim:0};
let best=0;try{best=+localStorage.getItem('ninours_best_coins')||0;}catch(e){} // best = most coins in one run

function reset(){
  scroll=0;maxScroll=0;dist=0;o2=100;bear.y=surfY+60*S;bear.vy=0;bear.ang=0;bearX=bearHome;speed=115*S;
  enemies=[];items=[];airs=[];puffs=[];fx=[];reefs=[];coins=[];scooterT=0;invulnT=0;shakeT=0;coinsRun=0;nextCoin=1.2;
  nextEnemy=1.8;nextThrow=rand(6,8);nextAir=rand(3,5);newRecord=false;nextMile=250;sayCool=3;
  nextReef=W+1300*S;reefCount=0;A=0;abyssSaid=false;
  koala.say="C'est parti !";koala.sayT=2;
}
const waveY=x=>surfY+Math.sin((x+scroll)*0.018/S+t*1.8)*3*S+Math.sin((x+scroll)*0.041/S-t*2.6)*1.6*S;
const boatX=()=>Math.min(W-90*S,bearHome+Math.max(150*S,W*0.32))+Math.sin(t*0.45)*10*S;

// ---------- reefs (tunnels & mounds) ----------
function makeReef(wx){
  const water=floorY-surfY;reefCount++;
  const tunnel=reefCount===1?false:Math.random()<0.6;
  const r={pal:Math.random()<A?APAL[Math.floor(Math.random()*APAL.length)]:PAL[Math.floor(Math.random()*PAL.length)],wx,type:tunnel?'tunnel':'mound',ph:Math.random()*6,warned:false,hue:Math.floor(Math.random()*PAL.length),seed:Math.floor(Math.random()*1000)};
  if(tunnel){
    r.len=rand(520,900)*S;
    r.gap=Math.max(112,172-dist*0.02)*S;
    r.amp=Math.max(0,Math.min(rand(15,45)*S,(water-r.gap)/2-18*S));
    r.mid=(surfY+floorY)/2+rand(-1,1)*Math.max(0,(water-r.gap)/2-r.amp-18*S);
    r.freq=rand(0.008,0.014);
    r.pocket=Math.random()<(dist<2000?0.55:0.3);
    if(r.pocket){
      r.PL=rand(85,100)*S;r.thick=20*S;r.mid=floorY-92*S-r.gap/2;
      r.amp=Math.max(0,Math.min(r.amp,r.mid-r.gap/2-surfY-20*S));
      r.len=Math.max(r.len,r.PL+320*S);r.treasure={u:r.PL-38*S,got:false};
    }
  }else{r.len=rand(220,380)*S;r.h=rand(0.3,0.5)*water;}
  return r;
}
function reefEdge(r,sx){
  const u=sx+scroll-r.wx;if(u<0||u>r.len)return null;
  const us=u/S;
  if(r.type==='tunnel'){
    const R=120*S,e=smooth(u/R)*smooth((r.len-u)/R);
    const ampK=r.pocket?smooth((u-r.PL)/(100*S)):1;
    const c=r.mid+Math.sin(us*r.freq+r.ph)*r.amp*ampK;
    const n1=(Math.sin(us*0.07+r.ph)*4+Math.sin(us*0.023+r.seed)*4)*S,n2=(Math.sin(us*0.061+r.seed)*4+Math.sin(us*0.031+r.ph)*4)*S;
    const eb=r.pocket?smooth((r.len-u)/R):e;
    let bot=lerp(floorY+14*S,c+r.gap/2-(r.pocket&&u<r.PL+40*S?n2*0.3:n2),eb),botEnd=H+60*S,ground=null;
    if(r.pocket&&u<r.PL){const f=smooth(u/(36*S));bot+=(1-f)*r.thick*0.4;botEnd=bot+r.thick*(0.35+0.65*f);ground=floorY+2*S;}
    return{top:lerp(surfY-14*S,c-r.gap/2+n1,e),bot,botEnd,ground,e};
  }
  const b=smooth(Math.sin(Math.PI*u/r.len)*1.15);const n=(Math.sin(us*0.08+r.ph)*5+Math.sin(us*0.03)*4)*S;
  return{top:null,bot:lerp(floorY+14*S,floorY-r.h+n,b),botEnd:H+60*S,ground:null,e:b};
}
function edgesAt(sx){let top=-1e9,bot=1e9;for(const r of reefs){const e=reefEdge(r,sx);if(!e)continue;if(e.top!=null)top=Math.max(top,e.top);bot=Math.min(bot,e.bot);}return{top,bot};}

// ---------- input: on-screen + pad ----------
const pointers=new Map(),keys={};let inp={v:0,h:0,touch:null};
function computeInput(){
  let v=0,h=0,touch=null;
  for(const pt of pointers.values())touch=pt;
  if(touch&&!portrait){
    const dx=touch.x-bearX,dy=touch.y-bear.y;
    v=Math.abs(dy)<8*S?0:clamp(dy/(90*S),-1,1);
    if(dx>90*S)h=clamp((dx-90*S)/(W*0.5),0,1);else if(dx<-30*S)h=-clamp((-dx-30*S)/(W*0.2),0,1);
  }
  if(keys.ArrowUp||keys.KeyW)v=-1;if(keys.ArrowDown||keys.KeyS)v=1;if(keys.ArrowRight||keys.KeyD)h=1;if(keys.ArrowLeft||keys.KeyA)h=-1;
  inp={v,h,touch};
}
// ===== Classement Google Sheets =====
// Colle entre les apostrophes l'adresse de ton script Google (elle se termine par /exec).
// Laisse vide pour jouer sans classement. Sur Claude, le classement est simplement ignoré.
const LEADERBOARD_URL='https://script.google.com/macros/s/AKfycbw9qriT7jxza-vQc6BPdaWNV5A_yY9r47JpIh0h5_uLb85LhX-m6zYlpLJwjJ6MU4Fz/exec';
let lbOn=false,lbState=LEADERBOARD_URL?'loading':'off',lbTop=[],lbStatus='',pseudo='',pseudoOpen=false,afterPseudo=null,pseudoLink=null;
try{pseudo=localStorage.getItem('ninours_pseudo')||'';}catch(e){}
function lbFetch(){
  if(!LEADERBOARD_URL)return;
  const ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(()=>ctl&&ctl.abort(),7000);
  if(!lbOn)lbState='loading';
  fetch(LEADERBOARD_URL+'?t='+Date.now(),ctl?{signal:ctl.signal}:{}).then(r=>r.json()).then(d=>{clearTimeout(to);if(d&&Array.isArray(d.top)){lbTop=d.top;lbOn=true;lbState='ok';}else if(!lbOn)lbState='error';}).catch(()=>{clearTimeout(to);if(!lbOn)lbState='error';});
}
function lbSend(coins){
  if(!LEADERBOARD_URL||!pseudo||coins<=0)return;
  lbStatus='Envoi du score…';
  fetch(LEADERBOARD_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pseudo,coins})})
    .then(()=>{lbStatus='';setTimeout(lbFetch,600);}).catch(()=>{lbStatus='Score non envoyé (connexion ?)';});
}
const pbox=document.getElementById('pseudoBox'),pin=document.getElementById('pseudoIn');
function askPseudo(then){pseudoOpen=true;afterPseudo=then;pointers.clear();pin.value=pseudo;pbox.hidden=false;setTimeout(()=>{try{pin.focus();}catch(e){}},60);}
document.getElementById('pseudoForm').addEventListener('submit',e=>{e.preventDefault();
  const v=pin.value.replace(/[<>]/g,'').replace(/^[=+\-@\s]+/,'').trim().slice(0,14);if(!v){pin.focus();return;}
  pseudo=v;try{localStorage.setItem('ninours_pseudo',v);}catch(e){}
  try{pin.blur();}catch(e){}pbox.hidden=true;pseudoOpen=false;const f=afterPseudo;afterPseudo=null;if(f)f();});
lbFetch();
function tapStart(){
  if(portrait)return;
  if(pseudoOpen)return;
  if(state==='menu'){if(LEADERBOARD_URL&&!pseudo){askPseudo(()=>{reset();state='play';});return;}reset();state='play';}
  else if(state==='over'&&overT>1){reset();state='play';}
}
let pauseBtn={x:-99,y:-99,s:0};
function setPause(on){if(on&&state==='play'){state='pause';pointers.clear();for(const k in keys)keys[k]=false;lbFetch();}else if(!on&&state==='pause'){state='play';last=performance.now();}}
function onPauseBtn(x,y){const p=pauseBtn,m=10;return x>p.x-m&&x<p.x+p.s+m&&y>p.y-m&&y<p.y+p.s+m;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='pause'){setPause(false);return;}
  if(state==='play'&&onPauseBtn(e.clientX,e.clientY)){setPause(true);return;}
  if(state==='menu'&&pseudoLink){const L=pseudoLink;if(e.clientX>L.x-10&&e.clientX<L.x+L.w+10&&e.clientY>L.y-12&&e.clientY<L.y+L.h+12){askPseudo(null);return;}}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});tapStart();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);});
window.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});});
const lift=e=>pointers.delete(e.pointerId);
window.addEventListener('pointerup',lift);window.addEventListener('pointercancel',lift);
window.addEventListener('blur',()=>{pointers.clear();for(const k in keys)keys[k]=false;setPause(true);});
window.addEventListener('keydown',e=>{if(pseudoOpen||(e.target&&e.target.tagName==='INPUT'))return;if(e.code==='KeyP'||e.code==='Escape'||(e.code==='Space'&&(state==='play'||state==='pause'))){e.preventDefault();if(!e.repeat)setPause(state==='play');return;}if(state==='pause'){if(!e.repeat&&(e.code==='Space'||e.code==='Enter'))setPause(false);return;}if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(!e.repeat&&(e.code==='Space'||e.code==='Enter'||e.code.startsWith('Arrow')))tapStart();keys[e.code]=true;});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ---------- helpers ----------
function addText(x,y,text,color,size){fx.push({x,y,vx:0,vy:-34*S,life:1.3,max:1.3,text,color,size:size||18*S});}
function burst(x,y,spr,n){for(let i=0;i<(n||14);i++){const a=Math.random()*Math.PI*2,v=rand(40,160)*S;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(0.4,0.8),max:0.8,spr,size:rand(6,12)*S});}}
function splash(x,y){for(let i=0;i<12;i++)fx.push({x:x+rand(-8,8)*S,y,vx:rand(-90,90)*S,vy:rand(-230,-80)*S,g:800*S,life:0.65,max:0.65,spr:G.white,size:rand(4,7)*S});}
function bearPoint(lx,ly){const c=Math.cos(bear.ang),s=Math.sin(bear.ang);return{x:bearX+(lx*c-ly*s)*S,y:bear.y+(lx*s+ly*c)*S};}
function bearCircles(){return[[0,2,22],[38,-6,17],[-28,4,14]].map(([x,y,r])=>{const p=bearPoint(x,y);p.r=r*S*0.85;return p;});}
function solidsAt(sx){const out=[];for(const r of reefs){const e=reefEdge(r,sx);if(!e)continue;if(e.top!=null)out.push([-1e4,e.top]);out.push([e.bot,e.botEnd]);if(e.ground!=null)out.push([e.ground,1e4]);}return out;}
function circlePen(c){let best=0;for(const ox of[-0.6,0,0.6]){const x=c.x+ox*c.r,rr=c.r*(ox?0.8:1);for(const [a,b] of solidsAt(x)){if(c.y+rr>a&&c.y-rr<b){const up=(c.y+rr)-a,down=b-(c.y-rr);const d=up<down?-up:down;if(Math.abs(d)>Math.abs(best))best=d;}}}return best;}
function maxPen(){let m=0;for(const c of bearCircles())m=Math.max(m,Math.abs(circlePen(c)));return m;}
function pushOutOfReefs(){
  let touched=false;
  for(let it=0;it<4;it++){let moved=false;
    for(const c of bearCircles()){const d=circlePen(c);if(Math.abs(d)>0.3*S){bear.y+=d;moved=true;touched=true;if(d>0&&bear.vy<0)bear.vy=0;if(d<0&&bear.vy>0)bear.vy=0;break;}}
    if(!moved)break;}
  return touched;
}
function hurt(amount,x,y,say){
  o2-=amount;invulnT=1.3;shakeT=0.3;
  addText(x,y,'-'+amount+' O₂','#ff8a8a',17*S);burst(x,y,G.red,12);
  koala.say=say;koala.sayT=1.6;
}
function spawnCoins(){
  const n=5+Math.floor(Math.random()*4),sp=44*S,x0=W+30*S,pat=Math.floor(Math.random()*3);
  let [a,b]=waterRangeAt(x0,26*S,26*S);if(b<a)return;
  const amp=Math.min(45*S,(b-a)/2);
  const bands=[];for(const e of enemies)if(e.x>W*0.4||e.warn>0)bands.push([e.y-(e.amp||0)-e.ry*2,e.y+(e.amp||0)+e.ry*2]);
  const y0=pickY(a+amp,Math.max(a+amp,b-amp),amp,bands,45*S);
  for(let i=0;i<n;i++){
    const x=x0+i*sp;let y=y0;
    if(pat===1)y=y0+Math.sin(i*0.9)*amp;
    if(pat===2)y=y0+amp-Math.sin(Math.PI*i/(n-1))*amp*2;
    const [ca,cb]=waterRangeAt(x,26*S,26*S);
    coins.push({x,y:clamp(y,ca,Math.max(ca,cb)),ph:i*0.5});
  }
}
function waterRangeAt(sx,mt,mb){const e=edgesAt(sx);return[Math.max(surfY+mt,e.top+mt),Math.min(floorY-mb,e.bot-mb)];}

function tunnelNear(x0,x1){for(const r of reefs){if(r.type!=='tunnel')continue;const s0=r.wx-scroll,s1=s0+r.len;if(s1>x0&&s0<x1)return true;}return false;}
// distance between vertical bands [a1,b1] and [a2,b2] (0 if overlapping)
const bandGap=(a1,b1,a2,b2)=>Math.max(0,a2-b1,a1-b2);
// choose a centre y in [lo,hi] whose band (half-height ext) stays far from the given bands
function pickY(lo,hi,ext,bands,margin){
  if(hi<=lo)return (lo+hi)/2;
  const cands=[];for(let i=0;i<12;i++)cands.push(lo+(hi-lo)*(i+Math.random())/12);
  const score=y=>{let m=1e9;for(const [ba,bb] of bands)m=Math.min(m,bandGap(y-ext,y+ext,ba,bb));return m;};
  const good=cands.filter(y=>score(y)>=margin);
  if(good.length)return good[Math.floor(Math.random()*good.length)];
  let best=cands[0],bs=-1;for(const y of cands){const sc=score(y);if(sc>bs){bs=sc;best=y;}}return best;
}
function spawnEnemy(){
  const noOcto=tunnelNear(W-140*S,W+260*S);
  // lagoon fish fade out around 1000 m and abyss creatures take over (octopus stays)
  const w=[];
  if(A<0.98)w.push(['fish',1-A]);
  if(dist>80&&A<0.98)w.push(['zig',0.7*(1-A)]);
  if(dist>300&&A<0.98)w.push(['fast',0.55*(1-A)]);
  if(dist>160&&!noOcto)w.push(['octo',0.55]);
  if(A>0.02){w.push(['lion',0.7*A]);w.push(['moray',0.9*A]);w.push(['chim',0.7*A]);w.push(['devil',0.8*A]);}
  let tot=0;for(const a of w)tot+=a[1];let r=Math.random()*tot,type=w[0][0];for(const [k,v] of w){if((r-=v)<0){type=k;break;}}
  const lvl=Math.min(1,dist/1800);
  let [a,b]=waterRangeAt(W+60*S,26*S,30*S);if(b<a){a=b=(a+b)/2;}
  const room=(b-a)/2;
  const e={type,x:W+60*S,y:0,baseY:0,ph:Math.random()*6,warn:0,v:0,var:Math.random(),amp:0};
  if(type==='fish'){e.sp=Math.random()<0.5?'picasso':'girelle';e.rx=(e.sp==='picasso'?18:21)*S;e.ry=(e.sp==='picasso'?12:8)*S;e.v=rand(50,110)*S*(1+lvl*0.6);}
  if(type==='zig'){e.rx=14*S;e.ry=15*S;e.v=rand(40,80)*S*(1+lvl*0.5);e.amp=Math.min(rand(25,50)*S,room);}
  if(type==='fast'){e.rx=30*S;e.ry=6*S;e.v=rand(200,270)*S*(1+lvl*0.4);e.x=W+80*S;e.warn=0.85;}
  if(type==='moray'){e.rx=36*S;e.ry=8*S;e.hox=30*S;e.v=rand(70,120)*S*(1+lvl*0.3);e.amp=rand(6,14)*S;}
  if(type==='chim'){e.rx=26*S;e.ry=9*S;e.hox=-6*S;e.v=rand(15,40)*S;e.amp=Math.min(rand(15,30)*S,room);}
  if(type==='devil'){e.rx=17*S;e.ry=15*S;e.v=rand(25,50)*S;}
  if(type==='lion'){e.rx=22*S;e.ry=17*S;e.v=rand(35,70)*S*(1+lvl*0.4);e.off=rand(-45,45)*S;}
  if(type==='octo'){e.rx=20*S;e.ry=32*S;e.v=rand(0,18)*S;e.amp=Math.min(rand(18,36)*S,Math.max(0,room-20*S));e.x=W+40*S;}
  // keep away from coins still ahead of the bear (and from coins in general for the octopus)
  const bands=[];for(const c of coins)if(c.x>bearX-20*S)bands.push([c.y-14*S,c.y+14*S]);
  const ext=e.amp+e.ry,lo=a+e.amp,hi=Math.max(a+e.amp,b-e.amp);
  e.baseY=pickY(lo,hi,ext,bands,type==='octo'?60*S:40*S);
  const openSky=edgesAt(W+60*S).top<-1e8&&edgesAt(W-60*S).top<-1e8;
  if(openSky&&Math.random()<0.25+0.15*lvl){
    if(type==='octo'){e.amp=4*S;e.baseY=surfY+30*S;}
    else{e.amp=Math.min(e.amp||0,6*S);e.baseY=surfY+(e.amp?e.amp+4*S:rand(3,9)*S);if(e.off!=null)e.off=0;}
  }
  e.y=e.baseY;
  enemies.push(e);
}
function throwItem(){
  const kx=boatX(),ky=waveY(kx);
  if(edgesAt(kx+170*S).top>-1e8||edgesAt(kx).top>-1e8)return false;
  const type=Math.random()<0.55?'bottle':'scooter';

}
function die(reason){
  state='over';overT=0;deathReason=reason;bear.vy=0;
  if(coinsRun>best){best=coinsRun;newRecord=true;try{localStorage.setItem('ninours_best_coins',String(best));}catch(e){}}

// ---------- update ----------
function updateCommon(dt){
  for(const p of plankton){p.x-=(speed*p.z*0.6+6*S)*dt;p.p+=dt;if(p.x<-10){p.x=W+10;p.y=rand(surfY+10,floorY);}else if(p.x>W+12){p.x=-10;p.y=rand(surfY+10,floorY);}}
  for(const p of puffs){p.x-=speed*0.9*dt;p.y-=42*S*dt;p.x+=Math.sin(t*5+p.ph)*10*S*dt;p.life-=dt;}
  puffs=puffs.filter(p=>p.life>0&&p.y>waveY(p.x)&&p.y>edgesAt(p.x).top);
  for(const p of fx){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;}
  fx=fx.filter(p=>p.life>0);
  if(koala.sayT>0)koala.sayT-=dt;if(koala.throwAnim>0)koala.throwAnim-=dt;
}
function exhale(dt){
  puffT-=dt;
  if(puffT<=0&&bear.y>surfY+14*S){const p=bearPoint(38,-31);puffs.push({x:p.x,y:p.y,r:rand(2,4.5)*S,life:2,ph:Math.random()*6});puffT=rand(0.25,0.55);}
}
function moveEnemies(dt,k){
  for(const e of enemies){
    if(e.warn>0){e.warn-=dt;continue;}
    e.ph+=dt;e.x-=(speed+e.v*k)*dt;
    if(e.type==='zig')e.y=e.baseY+Math.sin(e.ph*3)*e.amp;
    if(e.type==='octo')e.y=e.baseY+Math.sin(e.ph*1.3)*e.amp;
    if(e.type==='moray')e.y=e.baseY+Math.sin(e.ph*1.6)*e.amp;
    if(e.type==='chim')e.y=e.baseY+Math.sin(e.ph*0.9)*e.amp;
    if(e.type==='devil'&&state==='play'){const dx=e.x-bearX;
      if(!e.lunge&&dx>0&&dx<180*S)e.lunge=true; // last-moment strike toward the bear
      if(e.lunge&&dx>-20*S){const [a,b]=waterRangeAt(e.x,18*S,18*S);e.y=clamp(e.y+clamp((bear.y-e.y)/(30*S),-1,1)*65*S*dt,a,Math.max(a,b));e.x-=45*S*dt;}}
    if(e.type==='lion'&&e.x>bearX+40*S&&e.x<W&&state==='play'){const [a,b]=waterRangeAt(e.x,20*S,20*S);const ty=bear.y+e.off;e.y=clamp(e.y+clamp((ty-e.y)/(40*S),-1,1)*16*S*dt,a,Math.max(a,b));}
  }
}
function update(dt){
  if(state==='pause')return;
  t+=dt;sayCool-=dt;computeInput();
  if(portrait&&state==='play')return;
  if(state==='menu'){
    speed=60*S;scroll+=speed*dt;bearX=bearHome;
    bear.y=surfY+70*S+Math.sin(t*1.5)*12*S;bear.ang=Math.cos(t*1.5)*0.12;bear.phase+=dt*6;
    updateCommon(dt);exhale(dt);return;
  }
  if(state==='over'){
    overT+=dt;speed*=Math.pow(0.15,dt);scroll+=speed*dt;
    bear.y+=(surfY+10*S-bear.y)*Math.min(1,dt*0.9);bear.ang+=(0-bear.ang)*Math.min(1,dt*2);bear.phase+=dt*2;
    pushOutOfReefs();
    moveEnemies(dt,0.3);enemies=enemies.filter(e=>e.x>-120*S);
    for(const c of coins){c.x-=speed*dt;c.ph+=dt;}
    for(const it of items){if(it.wet){it.x-=speed*dt;it.y=Math.min(it.y+it.vy*dt,floorY-16*S,edgesAt(it.x).bot-16*S);}}
    updateCommon(dt);return;
  }
  // --- play ---
  const boost=scooterT>0?1.5:1;
  const base=(120+Math.min(dist,3000)*0.07)*S;
  // the screen (and the koala's boat) always moves forward; touching behind only slows it a little
  const mult=inp.h>=0?1+inp.h*0.45:1+inp.h*0.5;
  speed+=(base*mult*boost-speed)*Math.min(1,(mult>1?1.6:3)*dt);
  const prevScroll=scroll,prevBX=bearX;let blocked=false;
  scroll+=speed*dt;
  // the bear moves on the screen: back when you touch behind it, otherwise back to its spot
  const minX=safeL+45*S;
  if(inp.h<-0.05)bearX+=inp.h*base*2.6*dt;
  else{const tx=bearHome+inp.h*W*0.07;bearX+=(tx-bearX)*Math.min(1,2.5*dt);}
  if(bearX<minX)bearX=minX;
  let slid=false;
  if(maxPen()>1*S){const y0=bear.y,vy0=bear.vy;pushOutOfReefs();
    if(maxPen()>3*S||Math.abs(bear.y-y0)>26*S){
      bear.y=y0;bear.vy=vy0;blocked=true;
      // pinned by a reef wall: the bear keeps its place in the sea while the screen moves on
      bearX=Math.min(bearX,prevScroll+prevBX-scroll);
      if(bearX<minX-0.5){die('crush');updateCommon(dt);return;}
    }else slid=true;}
  dist+=speed*dt/(40*S);
  A=smooth((dist-800)/500);
  if(A>0.25&&!abyssSaid){abyssSaid=true;koala.say='On descend dans les abysses…';koala.sayT=3;sayCool=4;}

  // reefs
  while(nextReef<scroll+W+400*S){const r=makeReef(nextReef);reefs.push(r);nextReef+=r.len+rand(900,1700)*S;}
  for(const r of reefs){if(r.type==='tunnel'&&!r.warned&&r.wx-scroll<W+60*S){r.warned=true;koala.say=r.pocket?'Un trésor sous le tunnel !':"Tunnel en vue, prends de l'air !";koala.sayT=2.6;sayCool=4;}}
  reefs=reefs.filter(r=>r.wx+r.len>scroll-W);

  // bear: stays on its line unless you steer
  const tvy=inp.v*260*S;
  bear.vy+=(tvy-bear.vy)*Math.min(1,7*dt);
  const prevY=bear.y;
  bear.y+=bear.vy*dt;
  const top=surfY-8*S,bot=floorY-26*S;
  if(bear.y<top){bear.y=top;bear.vy=Math.max(bear.vy,0);}
  if(bear.y>bot){bear.y=bot;bear.vy=Math.min(bear.vy,0);}
  if(invulnT>0)invulnT-=dt;if(shakeT>0)shakeT-=dt;
  const touching=pushOutOfReefs()||blocked||slid;
  if(touching&&!touchPrev&&invulnT<=0)hurt(15,bearX+20*S,bear.y-26*S,'Attention au récif !');
  touchPrev=touching;
  // treasure
  for(const r of reefs){if(!r.treasure||r.treasure.got)continue;const tx2=r.wx+r.treasure.u-scroll,ty2=floorY-14*S;
    for(const c of bearCircles()){if(Math.hypot(c.x-tx2,c.y-ty2)<c.r+24*S){r.treasure.got=true;coinsRun+=15;burst(tx2,ty2,G.gold,30);addText(tx2,ty2-30*S,'Trésor ! +15','#ffd76a',22*S);koala.say='Vite, recule pour ressortir !';koala.sayT=2.5;break;}}}
  bear.ang+=(clamp(bear.vy/(420*S),-0.45,0.45)-bear.ang)*Math.min(1,8*dt);
  bear.phase+=dt*(7+Math.abs(inp.h)*7+Math.abs(bear.vy)/(40*S))*boost;
  const nowUnder=bear.y>surfY;
  if(prevUnder&&!nowUnder&&bear.vy<-120*S)splash(bearX+30*S,surfY);
  if(!prevUnder&&nowUnder&&bear.vy>120*S)splash(bearX,surfY);
  prevUnder=nowUnder;

  const breathing=bear.y<surfY+6*S;
  if(breathing)o2=Math.min(100,o2+60*dt);
  else o2-=(scooterT>0?4.5:8.5)*dt;
  if(o2<=0){o2=0;die('air');updateCommon(dt);return;}
  if(!breathing&&o2<30&&sayCool<=0){koala.say='Remonte respirer !';koala.sayT=2;sayCool=6;}
  if(scooterT>0)scooterT-=dt;
  exhale(dt);

  nextEnemy-=dt;if(nextEnemy<=0){spawnEnemy();nextEnemy=Math.max(0.4,1.6-dist*0.0009)*rand(0.75,1.25);}
  nextThrow-=dt;if(nextThrow<=0){nextThrow=throwItem()?rand(10,16):2;}
  nextAir-=dt;if(nextAir<=0){const [a,b]=waterRangeAt(W+20*S,20*S,15*S);if(b>a)airs.push({x:W+20*S,y:Math.max(a,b-rand(0,75)*S),ph:Math.random()*6});nextAir=rand(2.5,5);}

  moveEnemies(dt,1);
  const cs=bearCircles();
  for(const e of enemies){
    if(e.warn>0||e.gone)continue;
    const hy=e.type==='octo'?e.y+2*S:e.y;
    for(const c of cs){
      const dx=(c.x-e.x-(e.hox||0))/(e.rx+c.r),dy=(c.y-hy)/(e.ry+c.r);
      if(dx*dx+dy*dy<1){
        if(scooterT>0){e.gone=true;burst(e.x,e.y,e.type==='octo'?G.blue:G.orange,16);addText(e.x,e.y-20*S,'Paf !','#ffd76a');}
        else if(invulnT>0){}
        else if(e.type==='octo'){die('octo');updateCommon(dt);return;}
        else if(e.type==='lion'){e.gone=true;burst(e.x,e.y,G.mag,14);hurt(30,bearX+20*S,bear.y-26*S,'Aïe, une rascasse !');}
        else if(e.type==='devil'){e.gone=true;burst(e.x,e.y,G.cyan,14);hurt(30,bearX+20*S,bear.y-26*S,'Aïe, le diable noir !');}
        else if(e.type==='moray'){e.gone=true;burst(e.x,e.y,G.blue,14);hurt(25,bearX+20*S,bear.y-26*S,'Aïe, une murène !');}
        else if(e.type==='chim'){e.gone=true;burst(e.x,e.y,G.violet,14);hurt(20,bearX+20*S,bear.y-26*S,'Aïe, une chimère !');}
        else{e.gone=true;burst(e.x,e.y,G.orange,10);hurt(20,bearX+20*S,bear.y-26*S,'Aïe, un poisson !');}
        break;
      }
    }
  }
  enemies=enemies.filter(e=>!e.gone&&e.x>-120*S);

  for(const it of items){
    if(!it.wet){it.vy+=900*S*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.rot+=dt*7;
      if(it.vy>0&&it.y>waveY(it.x)){it.wet=true;splash(it.x,surfY);it.vy=45*S;}}
    else{it.x-=speed*dt;it.y=Math.min(it.y+it.vy*dt,floorY-16*S,edgesAt(it.x).bot-16*S);it.rot=Math.sin(t*2+it.x*0.01)*0.3;
      for(const c of cs){if(Math.hypot(c.x-it.x,c.y-it.y)<c.r+20*S){it.got=true;break;}}
      if(it.got){
        if(it.type==='bottle'){o2=100;addText(it.x,it.y-20*S,'O₂ plein !','#9ff3ff');burst(it.x,it.y,G.cyan,18);}
        else{scooterT=6;addText(it.x,it.y-20*S,'Scooter !','#ffd76a');burst(it.x,it.y,G.gold,18);}
        koala.say='Bravo !';koala.sayT=1.5;
      }}
  }
  items=items.filter(it=>!it.got&&it.x>-40*S);

  nextCoin-=dt;if(nextCoin<=0){spawnCoins();nextCoin=rand(2.2,4);}
  for(const c of coins){c.x-=speed*dt;c.ph+=dt;
    for(const k of cs){if(Math.hypot(k.x-c.x,k.y-c.y)<k.r+18*S){c.got=true;coinsRun++;burst(c.x,c.y,G.gold,6);break;}}}
  coins=coins.filter(c=>!c.got&&c.x>-30*S);
  for(const a of airs){a.x-=speed*dt;a.y-=55*S*dt;a.ph+=dt;
    const ax=a.x+Math.sin(a.ph*3)*6*S;
    for(const c of cs){if(Math.hypot(c.x-ax,c.y-a.y)<c.r+14*S){a.got=true;o2=Math.min(100,o2+25);addText(ax,a.y-14*S,'+25 O₂','#bff6ff',15*S);burst(ax,a.y,G.white,8);break;}}}
  airs=airs.filter(a=>!a.got&&a.x>-30*S&&a.y>surfY+6*S&&a.y>edgesAt(a.x).top+8*S);
  updateCommon(dt);
}

// ---------- drawing: world ----------
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,surfY);g.addColorStop(0,'#060716');g.addColorStop(0.7,'#15123a');g.addColorStop(1,'#2a1d4e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,surfY+12*S);
  for(const s of stars){ctx.globalAlpha=0.35+0.6*Math.abs(Math.sin(t*1.1+s.p));ctx.fillStyle='#e8ecff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  const mx=Math.min(W*0.8,W-safeR-110),my=surfY*0.42;
  q(G.white,mx,my,80*S,0.22);q(G.mag,mx,my,140*S,0.07);flush();
  ctx.fillStyle='#f4f1ff';ctx.beginPath();ctx.arc(mx,my,13*S,0,7);ctx.fill();
  ctx.fillStyle='#15123a';ctx.beginPath();ctx.arc(mx+6*S,my-3*S,11*S,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,surfY+4);
  for(let x=0;x<=W+6;x+=6){const u=(x+scroll*0.05)/S;const n=Math.sin(u*0.006)*0.6+Math.sin(u*0.017+1)*0.4;ctx.lineTo(x,surfY-Math.max(0,n-0.15)*40*S);}
  ctx.lineTo(W,surfY+4);ctx.closePath();ctx.fillStyle='#0b0a24';ctx.fill();
}
function drawWater(){
  ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+8;x+=8)ctx.lineTo(x,waveY(x));ctx.lineTo(W,H);ctx.closePath();
  const g=ctx.createLinearGradient(0,surfY,0,H);g.addColorStop(0,mix('#14506a','#1b1a4d',A));g.addColorStop(0.3,mix('#0a2c42','#0e0b2e',A));g.addColorStop(0.7,mix('#061626','#05041a',A));g.addColorStop(1,mix('#02060d','#010006',A));
  ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.globalCompositeOperation='lighter';
  const gr=ctx.createLinearGradient(0,surfY,0,floorY);gr.addColorStop(0,mix('#82e1ff','#9a82ff',A,0.13*(1-0.7*A)));gr.addColorStop(1,'rgba(130,180,255,0)');ctx.fillStyle=gr;
  const n=Math.max(5,Math.round(W/170));
  for(let i=0;i<n;i++){
    const span=W+300*S;let x0=((i*span/n+Math.sin(t*0.3+i)*40*S-scroll*0.08)%span+span)%span-150*S;
    ctx.beginPath();ctx.moveTo(x0,surfY);ctx.lineTo(x0+30*S,surfY);ctx.lineTo(x0+170*S,floorY);ctx.lineTo(x0+60*S,floorY);ctx.closePath();ctx.fill();
  }

}
function farN(x){const u=(x+scroll*0.15)/S;return(Math.sin(u*0.004)*0.5+Math.sin(u*0.011+1.7)*0.3+Math.sin(u*0.029+0.4)*0.2)*0.5+0.5;}
function drawFar(){

function drawMid(){

}
function drawRotate(){
  ctx.fillStyle='rgba(3,6,16,0.88)';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*0.42,a=Math.sin(t*1.6)*0.5+0.5;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-a*Math.PI/2);
  ctx.strokeStyle='#8ff4ff';ctx.lineWidth=3;roundRect(-28,-48,56,96,10);ctx.stroke();
  ctx.fillStyle='#8ff4ff';ctx.beginPath();ctx.arc(0,38,3.5,0,7);ctx.fill();ctx.restore();
  q(G.cyan,cx,cy,90,0.15);flush();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 22px ${FONT}`;ctx.fillStyle='#ffe2b0';
  ctx.fillText('Tourne ton téléphone',cx,cy+90);
  ctx.font=`600 15px ${FONT}`;ctx.fillStyle='rgba(225,238,255,0.85)';ctx.fillText('Le jeu se joue à l’horizontale',cx,cy+120);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();if(shakeT>0&&state==='play')ctx.translate(rand(-4,4)*S*shakeT*3,rand(-4,4)*S*shakeT*3);
  drawSky();drawWater();drawFar();drawMid();drawPlankton();
  drawNear();
  drawAirs();
  drawCoins();
  for(const it of items)if(it.wet)drawItem(it);
  drawPuffs();
  drawEnemies();
  drawReefs();
  drawBear();
  drawFore();
  drawSurfaceLine();
  drawBoat();
  for(const it of items)if(!it.wet)drawItem(it);
  drawFx();
  ctx.restore();
  drawVignette();
  if(state==='play'){drawHUD();drawSpeech();drawHints();}
  else if(state==='pause'){drawHUD();drawPauseScreen();}
  else if(state==='menu'){drawMenu();}
  else{drawSpeech();drawOver();}
  if(portrait)drawRotate();
}

let last=performance.now();
function frame(now){const dt=Math.min(0.033,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
